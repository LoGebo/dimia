# Llaves de proveedores (c01/prod/app) + PG_DSN armado del secreto que RDS rota: la contraseña
# de Aurora nunca se copia a mano.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: secrets-manager }
  target:
    name: app
    template:
      mergePolicy: Merge
      data:
        PG_DSN: 'postgresql://{{ .pg_usuario }}:{{ .pg_clave | urlquery }}@c01-mx.cluster-c7cs06k6ywps.mx-central-1.rds.amazonaws.com:5432/dimia?sslmode=require'
  dataFrom:
    - extract: { key: c01/prod/app }
  data:
    - secretKey: pg_usuario
      remoteRef: { key: "rds!cluster-55f015ff-d355-412d-ba79-65a78b53e4fe", property: username }
    - secretKey: pg_clave
      remoteRef: { key: "rds!cluster-55f015ff-d355-412d-ba79-65a78b53e4fe", property: password }
---
# El orquestador no acepta llaves de LLM de plataforma (agentes/config.py:guardia): recibe solo lo suyo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentes
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: secrets-manager }
  target:
    name: agentes
    template:
      data:
        PG_DSN: 'postgresql://{{ .pg_usuario }}:{{ .pg_clave | urlquery }}@c01-mx.cluster-c7cs06k6ywps.mx-central-1.rds.amazonaws.com:5432/dimia?sslmode=require'
        AGENTES_SECRETO: '{{ .AGENTES_SECRETO }}'
        PANEL_SECRETO: '{{ .PANEL_SECRETO }}'
        RELEVO_SECRETO: '{{ .RELEVO_SECRETO }}'
        FLY_API_TOKEN: '{{ .FLY_API_TOKEN }}'
        TYPESAFE_API_KEY: '{{ .TYPESAFE_API_KEY }}'
        VERCEL_AI_GATEWAY_KEY: '{{ .VERCEL_AI_GATEWAY_KEY }}'
        WHATSAPP_ACCESS_TOKEN: '{{ .WHATSAPP_ACCESS_TOKEN }}'
        WHATSAPP_PHONE_NUMBER_ID: '{{ .WHATSAPP_PHONE_NUMBER_ID }}'
  data:
    - { secretKey: AGENTES_SECRETO, remoteRef: { key: c01/prod/app, property: AGENTES_SECRETO } }
    - { secretKey: PANEL_SECRETO, remoteRef: { key: c01/prod/app, property: PANEL_SECRETO } }
    - { secretKey: RELEVO_SECRETO, remoteRef: { key: c01/prod/app, property: RELEVO_SECRETO } }
    - { secretKey: FLY_API_TOKEN, remoteRef: { key: c01/prod/app, property: FLY_API_TOKEN } }
    - { secretKey: TYPESAFE_API_KEY, remoteRef: { key: c01/prod/app, property: TYPESAFE_API_KEY } }
    - { secretKey: VERCEL_AI_GATEWAY_KEY, remoteRef: { key: c01/prod/app, property: VERCEL_AI_GATEWAY_KEY } }
    - { secretKey: WHATSAPP_ACCESS_TOKEN, remoteRef: { key: c01/prod/app, property: WHATSAPP_ACCESS_TOKEN } }
    - { secretKey: WHATSAPP_PHONE_NUMBER_ID, remoteRef: { key: c01/prod/app, property: WHATSAPP_PHONE_NUMBER_ID } }
    - { secretKey: pg_usuario, remoteRef: { key: "rds!cluster-55f015ff-d355-412d-ba79-65a78b53e4fe", property: username } }
    - { secretKey: pg_clave, remoteRef: { key: "rds!cluster-55f015ff-d355-412d-ba79-65a78b53e4fe", property: password } }
