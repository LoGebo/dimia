# Producción en c01-mx sobre Aurora c01-mx (base dimia). El worker de voz no lleva nombre: toma las
# llamadas que despacha la regla SIP de LiveKit. Los tokens de WhatsApp/Instagram sí van.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../base
  - secretos.yaml
patches:
  - target: { kind: Ingress, name: app }
    patch: |-
      - op: replace
        path: /metadata/name
        value: prod
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1load-balancer-name
        value: prod-c01-mx
  # Antes del corte: sin worker de voz (tomaría llamadas reales), despachador (mandaría mensajes) ni
  # orquestador (administraría las mismas máquinas Hermes que el de Fly).
  # En el corte pasan a 2 y 1 (runbook corte-a-aws.md).
  - target: { kind: Deployment, name: voz-worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: { kind: Deployment, name: agentes }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target: { kind: Deployment, name: despachador }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
images:
  - name: voz
    newName: 197821101689.dkr.ecr.mx-central-1.amazonaws.com/dimia/voz
    newTag: 3f986e9b0200
  - name: agentes
    newName: 197821101689.dkr.ecr.mx-central-1.amazonaws.com/dimia/agentes
    newTag: 3f986e9b0200
  - name: panel
    newName: 197821101689.dkr.ecr.mx-central-1.amazonaws.com/dimia/panel
    newTag: 3f986e9b0200
