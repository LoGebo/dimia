# Producción en c01-mx sobre Aurora c01-mx (base dimia). El worker de voz no lleva nombre: toma las
# llamadas que despacha la regla SIP de LiveKit. Los tokens de WhatsApp/Instagram sí van.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../base
  - secretos.yaml
patches:
  - target: { kind: Ingress, name: app }
    patch: |-
      - op: replace
        path: /metadata/name
        value: prod
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1load-balancer-name
        value: prod-c01-mx
  # Producción: 2 workers de voz (capacidad-y-despliegue: 2-3 activos), 1 despachador y 1 orquestador.
  - target: { kind: Deployment, name: voz-worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # Casas de Hermes en EC2 (infra/aws/vivos/celdas/c01/hermes): salidas de esa pila.
  - target: { kind: Deployment, name: agentes }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value: { name: PROVEEDOR_MAQUINAS, value: ec2 }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: EC2_PLANTILLA, value: "lt-01b8924359674e48e" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: EC2_SUBREDES, value: "subnet-016768cc6aeb9bec0,subnet-0dcd1d82604fe9cfd,subnet-0d1eff055899e6645" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: EC2_ENTORNO, value: "prod-c01" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: HERMES_REDES, value: "10.20.216.0/23,10.20.218.0/23,10.20.220.0/23" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: HERMES_IMAGEN, value: "197821101689.dkr.ecr.mx-central-1.amazonaws.com/dimia/hermes:1a21329f6e0e" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PROXY_URL, value: "http://agentes-proxy-a3ea3b2872e1416a.elb.mx-central-1.amazonaws.com:8080" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PUBLICO_URL, value: "https://d170r8qyvi0h3w.cloudfront.net" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OAUTH_URL, value: "https://dimia-agentes.fly.dev" }
  - target: { kind: Service, name: agentes-proxy }
    patch: |-
      - op: add
        path: /spec/loadBalancerSourceRanges
        value: ["10.20.216.0/21"]
  # Deepgram Flux decide el fin de turno (~250 ms contra ~630 ms del detector aparte).
  - target: { kind: Deployment, name: voz-worker }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TURNO_POR_STT, value: "true" }
images:
  - name: voz
    newName: 197821101689.dkr.ecr.mx-central-1.amazonaws.com/dimia/voz
    newTag: a5c1915e0ee1
  - name: agentes
    newName: 197821101689.dkr.ecr.mx-central-1.amazonaws.com/dimia/agentes
    newTag: a5c1915e0ee1
  - name: panel
    newName: 197821101689.dkr.ecr.mx-central-1.amazonaws.com/dimia/panel
    newTag: a5c1915e0ee1
