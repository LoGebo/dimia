# Llaves de proveedores (noprod/staging/app) + PG_DSN armado del secreto que RDS rota: la contraseña
# de Aurora nunca se copia a mano.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: secrets-manager }
  target:
    name: app
    template:
      mergePolicy: Merge
      data:
        PG_DSN: 'postgresql://{{ .pg_usuario }}:{{ .pg_clave | urlquery }}@noprod-mx.cluster-cjoas6iwue6l.mx-central-1.rds.amazonaws.com:5432/staging?sslmode=require'
  dataFrom:
    - extract: { key: noprod/staging/app }
  data:
    - secretKey: pg_usuario
      remoteRef: { key: "rds!cluster-7d2b7cbc-9acb-4578-bcbf-6c3d56c24ccb", property: username }
    - secretKey: pg_clave
      remoteRef: { key: "rds!cluster-7d2b7cbc-9acb-4578-bcbf-6c3d56c24ccb", property: password }
---
# El orquestador no acepta llaves de LLM de plataforma (agentes/config.py:guardia): recibe solo lo suyo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentes
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: secrets-manager }
  target:
    name: agentes
    template:
      data:
        PG_DSN: 'postgresql://{{ .pg_usuario }}:{{ .pg_clave | urlquery }}@noprod-mx.cluster-cjoas6iwue6l.mx-central-1.rds.amazonaws.com:5432/staging?sslmode=require'
        AGENTES_SECRETO: '{{ .AGENTES_SECRETO }}'
        PANEL_SECRETO: '{{ .PANEL_SECRETO }}'
  data:
    - { secretKey: AGENTES_SECRETO, remoteRef: { key: noprod/staging/app, property: AGENTES_SECRETO } }
    - { secretKey: PANEL_SECRETO, remoteRef: { key: noprod/staging/app, property: PANEL_SECRETO } }
    - { secretKey: pg_usuario, remoteRef: { key: "rds!cluster-7d2b7cbc-9acb-4578-bcbf-6c3d56c24ccb", property: username } }
    - { secretKey: pg_clave, remoteRef: { key: "rds!cluster-7d2b7cbc-9acb-4578-bcbf-6c3d56c24ccb", property: password } }
