# Llaves de proveedores (noprod/staging/app) + PG_DSN armado del secreto que RDS rota: la contraseña
# de Aurora nunca se copia a mano.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: secrets-manager }
  target:
    name: app
    template:
      mergePolicy: Merge
      data:
        PG_DSN: 'postgresql://{{ .pg_usuario }}:{{ .pg_clave | urlquery }}@noprod-mx.cluster-cjoas6iwue6l.mx-central-1.rds.amazonaws.com:5432/staging?sslmode=require'
  dataFrom:
    - extract: { key: noprod/staging/app }
  data:
    - secretKey: pg_usuario
      remoteRef: { key: "rds!cluster-7d2b7cbc-9acb-4578-bcbf-6c3d56c24ccb", property: username }
    - secretKey: pg_clave
      remoteRef: { key: "rds!cluster-7d2b7cbc-9acb-4578-bcbf-6c3d56c24ccb", property: password }
