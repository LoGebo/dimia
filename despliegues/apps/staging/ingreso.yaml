# Un ALB interno para staging; CloudFront (VPC origin) llega a él y cada distribución pone el
# encabezado X-Dimia-Servicio que elige el servicio. Sin encabezado, 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: staging-noprod-mx
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /salud
    alb.ingress.kubernetes.io/conditions.panel: '[{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Dimia-Servicio","values":["panel"]}}]'
    alb.ingress.kubernetes.io/conditions.api: '[{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Dimia-Servicio","values":["api"]}}]'
    alb.ingress.kubernetes.io/conditions.webhooks: '[{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Dimia-Servicio","values":["webhooks"]}}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: panel, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: webhooks, port: { name: http } } } }
