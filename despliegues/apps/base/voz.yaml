# Imagen voz: worker de LiveKit, API móvil, webhooks y despachador (mismo código, otro proceso).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voz-worker
spec:
  replicas: 1
  selector: { matchLabels: { app: voz-worker } }
  template:
    metadata: { labels: { app: voz-worker } }
    spec:
      nodeSelector: { kubernetes.io/arch: arm64, dimia.mx/pool: app-mx }
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: voz
          args: ["python", "-m", "agent.agent", "start"]
          envFrom: [{ secretRef: { name: app } }]
          env:
            - { name: LOG_LEVEL, value: INFO }
            - { name: PG_POOL_MAX, value: "2" }
          ports: [{ containerPort: 8081, name: salud }]
          readinessProbe: { httpGet: { path: /, port: salud }, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /, port: salud }, initialDelaySeconds: 90, periodSeconds: 30 }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 3Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      nodeSelector: { kubernetes.io/arch: arm64, dimia.mx/pool: app-mx }
      containers:
        - name: api
          image: voz
          args: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]
          envFrom: [{ secretRef: { name: app } }]
          env:
            - { name: AGENTES_URL, value: "http://agentes:8080" }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /salud, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /salud, port: http }, initialDelaySeconds: 20, periodSeconds: 30 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks
spec:
  replicas: 2
  selector: { matchLabels: { app: webhooks } }
  template:
    metadata: { labels: { app: webhooks } }
    spec:
      nodeSelector: { kubernetes.io/arch: arm64, dimia.mx/pool: app-mx }
      containers:
        - name: webhooks
          image: voz
          args: ["uvicorn", "channels.servidor:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]
          envFrom: [{ secretRef: { name: app } }]
          env:
            - { name: PG_POOL_MAX, value: "6" }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /salud, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /salud, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: despachador
spec:
  replicas: 1
  selector: { matchLabels: { app: despachador } }
  template:
    metadata: { labels: { app: despachador } }
    spec:
      nodeSelector: { kubernetes.io/arch: arm64, dimia.mx/pool: app-mx }
      containers:
        - name: despachador
          image: voz
          args: ["python", "-m", "app.despachador"]
          envFrom: [{ secretRef: { name: app } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
apiVersion: v1
kind: Service
metadata: { name: webhooks }
spec:
  selector: { app: webhooks }
  ports: [{ port: 8080, targetPort: http, name: http }]
