line-length = 100
target-version = "py313"
extend-exclude = [".venv", "supabase/.temp", ".pytest_cache"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[lint.per-file-ignores]
"tests/*" = ["S101"]

[lint.isort]
known-first-party = ["app", "agent", "api"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
