id: restaurante_cliente_interrumpe
descripcion: cliente que corta la palabra y cambia de idea a medio turno
tenant: restaurante
etiquetas: [barge_in, robustez]
telefono_cliente: "+5215522220005"
estado_inicial:
  dia: proximo_miercoles
persona: |
  Te llamas Karla Ibarra, traes prisa y cortas a quien te habla. Quieres mesa
  para dos el {dia} en la noche. Interrumpes al menos dos veces usando el
  prefijo de interrupcion antes de tu frase. Aceptas el primer horario que
  alcances a oir y das tu nombre.
guion:
  - "Quiero mesa el {dia} en la noche"
  - "[INTERRUMPE] para dos, para dos"
  - "[INTERRUMPE] esa misma, la primera que dijiste"
  - "Karla Ibarra"
  - "Si, confirmo [COLGAR]"
max_turnos: 12
rubrica:
  - tipo: reserva_creada
    servicio: Reservacion
    personas: 2
    nombre_contiene: Karla
  - tipo: escalo
    esperado: false
