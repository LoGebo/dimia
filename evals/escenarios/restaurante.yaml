id: restaurante_cancelacion
descripcion: cliente cancela su reservacion y no agenda otra
tenant: restaurante
etiquetas: [cancelacion]
telefono_cliente: "+5215522220002"
estado_inicial:
  dia: proximo_miercoles
  reservas:
    - servicio: Reservacion
      dia: proximo_miercoles
      hora: "20:00"
      nombre: Ernesto Lara
      personas: 2
persona: |
  Te llamas Ernesto Lara. Tienes una reservacion para dos el {dia} a las ocho de
  la noche y quieres cancelarla porque te salio un viaje. No quieres reagendar:
  si te lo ofrecen, agradeces y dices que despues llamas.
guion:
  - "Hola, quiero cancelar mi reservacion"
  - "A nombre de Ernesto Lara, es la del {dia}"
  - "Si, esa, cancelala por favor"
  - "No, gracias, despues les marco [COLGAR]"
max_turnos: 10
rubrica:
  - tipo: reserva_cancelada
    cantidad: 1
  - tipo: sin_reserva_nueva
  - tipo: escalo
    esperado: false
