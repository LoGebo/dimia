id: restaurante_dia_lleno_alternativa
descripcion: el dia pedido esta lleno, el agente debe ofrecer otro dia
tenant: restaurante
etiquetas: [dia_lleno, alternativa]
telefono_cliente: "+5215522220001"
estado_inicial:
  dia: proximo_miercoles
  llenar_dia: true
persona: |
  Te llamas Paulina Gil. Quieres mesa para cuatro personas el {dia} en la noche.
  Si te dicen que no hay nada ese dia, aceptas el dia siguiente a la hora que
  te ofrezcan. No cuelgas sin haber intentado el dia siguiente.
guion:
  - "Buenas, quiero una mesa para cuatro el {dia} en la noche"
  - "Entonces el dia siguiente, la misma hora esta bien"
  - "Esa opcion me late"
  - "Paulina Gil"
  - "Si, confirmo. Gracias [COLGAR]"
max_turnos: 12
rubrica:
  - tipo: reserva_creada
    servicio: Reservacion
    dia_relativo: 1
    personas: 4
    nombre_contiene: Paulina
  - tipo: escalo
    esperado: false
