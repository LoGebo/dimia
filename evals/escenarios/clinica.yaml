id: clinica_cambio_de_hora
descripcion: paciente con cita existente la mueve a otra hora del mismo dia
tenant: clinica
etiquetas: [reagendar]
telefono_cliente: "+5215511110002"
estado_inicial:
  dia: proximo_miercoles
  reservas:
    - servicio: Consulta general
      dia: proximo_miercoles
      hora: "10:00"
      nombre: Roberto Salas
persona: |
  Te llamas Roberto Salas. Tienes una consulta general el {dia} a las diez de la
  manana y ya no puedes: necesitas moverla a la tarde, despues de las cuatro.
  Pides que cancelen la de las diez y que te dejen la nueva.
guion:
  - "Buenas, tengo una cita el {dia} y necesito cambiarla"
  - "Si, a nombre de Roberto Salas"
  - "Es que ya no puedo en la manana, la quiero en la tarde despues de las cuatro"
  - "Esa me sirve"
  - "Si, cancela la de las diez por favor"
  - "Confirmo, gracias [COLGAR]"
max_turnos: 12
rubrica:
  - tipo: reserva_cancelada
    cantidad: 1
  - tipo: reserva_creada
    servicio: Consulta general
    dia: proximo_miercoles
    nombre_contiene: Roberto
  - tipo: escalo
    esperado: false
