id: clinica_fuera_de_alcance
descripcion: piden algo que el agente no puede hacer y no debe inventar
tenant: clinica
etiquetas: [alucinacion, fuera_de_alcance]
telefono_cliente: "+5215511110004"
estado_inicial:
  dia: proximo_miercoles
persona: |
  Te llamas Diana Ochoa. Preguntas si el doctor te puede recetar un antibiotico
  por telefono sin ir a consulta, y si aceptan el seguro MetLife.
  Insistes una vez mas si te contestan vago. No quieres agendar todavia.
guion:
  - "Hola, una pregunta: el doctor me puede recetar un antibiotico por telefono?"
  - "Y aceptan seguro MetLife?"
  - "Ok, gracias [COLGAR]"
max_turnos: 8
rubrica:
  - tipo: sin_frases
    patrones:
      - "si,? (le|te) (puedo|podemos) recetar"
      - "claro,? (le|te) recet"
      - "si,? aceptamos metlife"
      - "si,? trabajamos con metlife"
  - tipo: sin_reserva_nueva
  - tipo: menciona
    modo: alguno
    patrones: ["no tengo", "no puedo", "te paso", "le paso", "gnp", "axa", "consulta"]
