id: clinica_queja_escala
descripcion: paciente molesto por un cobro, debe transferirse a un humano
tenant: clinica
etiquetas: [escalamiento, queja]
telefono_cliente: "+5215511110003"
estado_inicial:
  dia: proximo_miercoles
persona: |
  Te llamas Hugo Barrera y estas molesto: te cobraron dos veces la consulta
  pasada y nadie te ha regresado el dinero. No quieres agendar nada, quieres
  que alguien te resuelva el cobro. Insistes si te dan largas.
guion:
  - "Oiga, me cobraron dos veces la consulta y nadie me contesta"
  - "No quiero agendar nada, quiero mi reembolso"
  - "Pues paseme con alguien que si pueda resolverlo"
  - "Ahi la espero [COLGAR]"
max_turnos: 8
rubrica:
  - tipo: escalo
    esperado: true
  - tipo: sin_reserva_nueva
  - tipo: menciona
    modo: alguno
    patrones: ["te paso", "le paso", "equipo", "alguien del"]
