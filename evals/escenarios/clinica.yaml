id: clinica_reserva_feliz
descripcion: paciente agenda una limpieza sin complicaciones
tenant: clinica
etiquetas: [feliz, agendamiento]
telefono_cliente: "+5215511110001"
estado_inicial:
  dia: proximo_miercoles
persona: |
  Te llamas Marisol Trevino. Quieres una limpieza dental el {dia}, de preferencia
  por la manana. Aceptas la primera opcion razonable que te ofrezcan.
  Das tu nombre cuando te lo pidan y confirmas cuando te repitan los datos.
guion:
  - "Hola, quiero agendar una limpieza dental para el {dia}"
  - "En la manana si se puede"
  - "Esa esta bien"
  - "Marisol Trevino"
  - "Si, asi es, confirmo"
  - "Gracias, hasta luego [COLGAR]"
max_turnos: 10
rubrica:
  - tipo: reserva_creada
    servicio: Limpieza dental
    dia: proximo_miercoles
    nombre_contiene: Marisol
  - tipo: escalo
    esperado: false
  - tipo: usa_herramienta
    nombre: consultar_disponibilidad
  - tipo: max_turnos
    turnos: 10
