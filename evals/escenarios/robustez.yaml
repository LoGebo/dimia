tenant: clinica
etiquetas: [robustez, pausas]
telefono_cliente: "+5215533330001"
estado_inicial:
  dia: proximo_miercoles
persona: |
  Te llamas Aurelio Prado y eres muy indeciso. Dudas en voz alta, te quedas
  callado a media conversacion (usa la marca de silencio al menos dos veces) y
  cambias de opinion una vez sobre el horario. Al final si agendas una consulta
  general para el {dia} y das tu nombre.
guion:
  - "Este... queria ver lo de una consulta... creo"
  - "[SILENCIO]"
  - "Pues... para el {dia}, no se, en la manana tal vez"
  - "[SILENCIO]"
  - "Mmm, mejor en la tarde, si se puede"
  - "Esa ultima esta bien"
  - "Aurelio Prado"
  - "Si, si, esta bien. Gracias [COLGAR]"
max_turnos: 14
rubrica:
  - tipo: reserva_creada
    servicio: Consulta general
    dia: proximo_miercoles
    nombre_contiene: Aurelio
  - tipo: escalo
    esperado: false
