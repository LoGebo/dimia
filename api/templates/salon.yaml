conocimiento:
  - pregunta: Donde estan ubicados
    respuesta: Estamos en la calle principal numero 20, colonia Centro.
    prioridad: 100
  - pregunta: Cuanto cuesta un corte
    respuesta: El corte de cabello cuesta 350 pesos.
    prioridad: 90
  - pregunta: Aceptan tarjeta
    respuesta: Si, aceptamos tarjeta, efectivo y transferencia.
    prioridad: 80
  - pregunta: Atienden sin cita
    respuesta: Si hay silla libre si, pero conviene apartar para no esperar.
    prioridad: 70
  - pregunta: Cuanto dura un tinte
    respuesta: Entre dos y dos horas y media, depende del largo del cabello.
    prioridad: 60
