name: Desplegar worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue-worker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Publicar imagen en GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyectos/voz
    timeout-minutes: 30
    outputs:
      etiqueta: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-agente
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: proyectos/voz
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fly:
    name: Desplegar en Fly.io
    needs: publicar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyectos/voz
    timeout-minutes: 25
    environment: produccion
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Desplegar
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config deploy/fly.toml \
            --dockerfile Dockerfile \
            --remote-only \
            --wait-timeout 600 \
            .

      - name: Verificar que el worker quedo registrado
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --config deploy/fly.toml
          for intento in $(seq 1 10); do
            if flyctl logs --config deploy/fly.toml --no-tail | grep -qi "registered worker"; then
              echo "worker registrado en LiveKit"
              exit 0
            fi
            sleep 15
          done
          echo "el worker no se registro con LiveKit: revisa LIVEKIT_URL y las llaves"
          exit 1
