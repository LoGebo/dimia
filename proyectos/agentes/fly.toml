# Orquestador de agentes: vault de Codex, máquinas de los negocios, turnos.
# Solo el panel le habla (desde Vercel, por HTTPS con PANEL_SECRETO).
app            = "dimia-agentes"
primary_region = "dfw"
kill_signal    = "SIGTERM"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED   = "1"
  FLY_APP_CEREBROS   = "dimia-cerebros"
  FLY_REGION         = "dfw"
  PROVEEDOR_MAQUINAS = "fly"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval     = "30s"
    method       = "GET"
    path         = "/salud"
    timeout      = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
