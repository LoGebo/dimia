# Webhooks de texto (WhatsApp) + despachador de salientes.
# App aparte del worker de voz: se despliega y escala sin tocar la línea.
app            = "agente-webhooks"
primary_region = "dfw"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "../Dockerfile"

[env]
  LOG_LEVEL       = "INFO"
  PYTHONUNBUFFERED = "1"
  # Con 4 conexiones, una rafaga de 100 mensajes ya esperaba el pool mas que al
  # modelo. PG_DSN va al pooler de Supabase (6543, modo transaccion): 12 por
  # proceso x (1 web + 2 despachadores) queda lejos de su limite de clientes.
  PG_POOL_MAX     = "12"

[processes]
  # Webhooks públicos de WhatsApp e Instagram/Messenger (Meta le pega aquí).
  web = "uvicorn channels.servidor:app --host 0.0.0.0 --port 8080"
  # Vacía la cola de salientes: recordatorios, campañas, reintentos.
  despachador = "python -m app.despachador"

# Solo el proceso web recibe tráfico público (HTTPS 443 -> 8080).
# Las sesiones de WhatsApp/Instagram viven en Postgres (conversacion_sesion, migración
# 20260925030000): el web puede correr en 2+ máquinas (`fly scale count web=2`) una vez
# aplicada esa migración. Antes de aplicarla, UNA sola máquina.
[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["web"]

  # Solo vida del proceso: la base se vigila aparte en /salud/base. Un check que
  # dependa de la base saca a todas las maquinas a la vez en un parpadeo del pooler.
  [[http_service.checks]]
    grace_period = "30s"
    interval     = "30s"
    method       = "GET"
    path         = "/salud"
    timeout      = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
