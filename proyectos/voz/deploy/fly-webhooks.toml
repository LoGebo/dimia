# Webhooks de texto (WhatsApp) + despachador de salientes.
# App aparte del worker de voz: se despliega y escala sin tocar la línea.
app            = "agente-webhooks"
primary_region = "dfw"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "../Dockerfile"

[env]
  LOG_LEVEL       = "INFO"
  PYTHONUNBUFFERED = "1"

[processes]
  # Webhook público de WhatsApp (Meta le pega aquí).
  web = "uvicorn channels.whatsapp.servidor:app --host 0.0.0.0 --port 8080"
  # Vacía la cola de salientes: recordatorios, campañas, reintentos.
  despachador = "python -m app.despachador"

# Solo el proceso web recibe tráfico público (HTTPS 443 -> 8080).
[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["web"]

  [[http_service.checks]]
    grace_period = "30s"
    interval     = "30s"
    method       = "GET"
    path         = "/salud"
    timeout      = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
