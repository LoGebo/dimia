app = "agente-voz"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]
  dockerfile = "../Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  PYTHONUNBUFFERED = "1"
  # Un pool por llamada (un proceso por llamada): con 4 conexiones, 25 llamadas
  # abren 100 contra el pooler de Supabase. Una llamada no necesita más de 2.
  PG_POOL_MAX = "2"

[processes]
  worker = "python -m agent.agent start"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "2gb"

[checks.salud]
  type = "tcp"
  port = 8081
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"

[deploy]
  strategy = "rolling"
  wait_timeout = "10m"
