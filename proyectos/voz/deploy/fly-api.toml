# La API de la app (iOS): misma imagen que voz y webhooks, otro proceso.
app            = "dimia-api"
primary_region = "dfw"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "../Dockerfile"

[env]
  LOG_LEVEL        = "INFO"
  PYTHONUNBUFFERED = "1"

[processes]
  web = "uvicorn api.main:app --host 0.0.0.0 --port 8080 --proxy-headers"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ["web"]

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "20s"
    method       = "GET"
    path         = "/salud"

[[vm]]
  processes = ["web"]
  size      = "shared-cpu-1x"
  memory    = "512mb"
