# Solo para desarrollo local. En produccion: Supabase gestionado + este
# contenedor del agente en un VPS chico.
services:
  agente:
    build: .
    env_file: .env
    restart: unless-stopped
    command: python -m agent.agent start

  # Vacia la cola de mensajes salientes. Va aparte del agente a proposito: el
  # worker de voz reparte trabajo por llamada, y la cola tiene que avanzar
  # aunque nadie este al telefono. Misma imagen, otro comando.
  despachador:
    build: .
    env_file: .env
    restart: unless-stopped
    command: python -m app.despachador

  # Webhook de Instagram Direct y Messenger.
  social:
    build: .
    env_file: .env
    restart: unless-stopped
    ports: ["8081:8081"]
    command: uvicorn channels.social.servidor:app --host 0.0.0.0 --port 8081

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Mexico_City
    volumes: [n8ndata:/home/node/.n8n]

volumes:
  n8ndata:
